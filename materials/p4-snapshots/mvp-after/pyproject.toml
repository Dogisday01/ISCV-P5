[project]
name = "p3-universal-mvp"
version = "0.1.0"
description = "Security-first FastAPI foundation for any P3 MVP variant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# report table 7.6: dependency versions
# dependency versions: pin supported version ranges for repeatable checks
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi[standard]>=0.115.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "python-multipart>=0.0.26,<1.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0,<1.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
]

[dependency-groups]
# report table 7.6: dependency checks
# dependency checks: keep tools for sast and sca in the dev group
dev = [
    "bandit>=1.8.5,<2.0.0",
    "mypy==1.17.1",
    "pip-audit>=2.9.0,<3.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.1.1,<7.0.0",
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.11.13,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
exclude = [".venv", "alembic", "alembic_tmp"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "C4",
]
ignore = [
    "B008",
    "E501",
]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic", "alembic_tmp", ".venv"]

[tool.bandit]
configfile = "bandit.yaml"
